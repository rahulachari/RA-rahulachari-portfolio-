<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="gloss" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Die-Cut Vinyl Outer Border with Drop Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Inner Badge Container -->
  <rect x="36" y="36" width="440" height="440" rx="84" fill="#1c1917" stroke="#f97316" stroke-width="8"/>
  <rect x="36" y="36" width="440" height="440" rx="84" fill="url(#gloss)"/>

  <!-- Top Accent Tag -->
  <rect x="80" y="56" width="352" height="32" rx="16" fill="#f97316" fill-opacity="0.2"/>
  <text x="256" y="78" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f97316" letter-spacing="3" text-anchor="middle">RAHUL ACHARI // STACK 2026</text>

  <!-- Central Graphic Icon -->
  <g transform="translate(0, 0)">
    <path d="M180 340 L180 230 C180 175 220 150 256 150 C292 150 332 175 332 230 L332 340" fill="none" stroke="#f97316" stroke-width="16" stroke-linecap="round"/>
           <path d="M190 190 L160 120 L215 150" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
           <path d="M322 190 L352 120 L297 150" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
           <circle cx="220" cy="230" r="12" fill="#ffffff"/>
           <circle cx="292" cy="230" r="12" fill="#ffffff"/>
           <circle cx="256" cy="280" r="16" fill="#f97316"/>
  </g>

  <!-- Title & Subtitle Badge -->
  <rect x="64" y="396" width="384" height="60" rx="16" fill="#090a0f" fill-opacity="0.8" stroke="#f97316" stroke-width="2"/>
  <text x="256" y="424" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">GROQ LLAMA</text>
  <text x="256" y="444" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#fb923c" letter-spacing="2" text-anchor="middle">AUTONOMOUS REASONING</text>

  <!-- Vintage Vinyl Stamp Ring -->
  <circle cx="430" cy="80" r="24" fill="#f97316"/>
  <text x="430" y="86" font-family="monospace" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">#04</text>
</svg>