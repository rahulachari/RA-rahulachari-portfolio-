<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="moon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer die-cut border -->
  <circle cx="80" cy="80" r="70" fill="#FFFFFF" filter="url(#moon-shadow)"/>
  <circle cx="80" cy="80" r="64" fill="#e2e8f0"/>

  <!-- Pixelated texture matching 8-bit / dithered moon in haoqi -->
  <g fill="#475569">
    <rect x="40" y="36" width="12" height="12"/>
    <rect x="52" y="36" width="12" height="12"/>
    <rect x="40" y="48" width="12" height="12"/>
    <rect x="88" y="40" width="16" height="16"/>
    <rect x="104" y="40" width="16" height="16"/>
    <rect x="88" y="56" width="16" height="16"/>
    <rect x="48" y="72" width="20" height="20"/>
    <rect x="68" y="72" width="12" height="12"/>
    <rect x="48" y="92" width="12" height="12"/>
    <rect x="96" y="88" width="16" height="16"/>
    <rect x="80" y="104" width="20" height="16"/>
    <rect x="60" y="112" width="16" height="16"/>
  </g>
</svg>
